name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Packages that build without the generated eBPF object. `internal/handlers/tracer`
  # embeds bpf_bpfel_x86.o, which is gitignored and produced by `make generate`
  # (needs the clang toolchain), so it cannot be type-checked here. Defined once
  # so vet, test and nilaway cannot drift apart.
  ANALYZE_PKGS: ./pkg/... ./internal/core/...
  # Analysis tools are pinned, like every action SHA below. Bump deliberately.
  GOVULNCHECK_VERSION: v1.8.0
  NILAWAY_VERSION: v0.0.0-20260915122131-cb17e847f492

jobs:
  workflow-lint:
    name: Workflow and release configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: go.mod
      - name: Validate workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -color
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552
        with:
          version: v2.18.1
          args: check

  vet-and-test:
    name: Vet, Test & Nilaway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: ./go.sum
      - name: Verify go.sum
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go mod verify
      - name: Go vet
        run: go vet $ANALYZE_PKGS
      - name: Unit tests
        run: go test -count=1 -race $ANALYZE_PKGS
      # Shares this job's warm build cache: nilaway type-checks the same
      # packages vet and test just compiled.
      - name: Install nilaway
        run: go install go.uber.org/nilaway/cmd/nilaway@$NILAWAY_VERSION
      - name: Run nilaway
        run: nilaway -exclude-test-files $ANALYZE_PKGS

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: ./go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION
      # Module scan needs no build, so it covers every dependency of the whole
      # module — including the packages ANALYZE_PKGS has to leave out.
      - name: Scan dependencies
        run: govulncheck -scan module
      # Symbol scan is precise (reports only vulnerabilities actually reachable
      # from our code) but requires type-checking, so it is limited to the
      # buildable packages.
      - name: Scan reachable symbols
        run: govulncheck $ANALYZE_PKGS
